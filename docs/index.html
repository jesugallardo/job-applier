<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Applier - Envío de Candidaturas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 1rem;
        }
        .card { 
            background: #1e293b; 
            padding: 2.5rem; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 25px 50px rgba(0,0,0,.4);
            border: 1px solid #334155;
        }
        h1 { 
            font-size: 1.6rem; 
            margin-bottom: 0.5rem; 
            text-align: center;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-size: 0.9rem; 
            color: #cbd5e1;
            font-weight: 500;
        }
        input, textarea { 
            width: 100%; 
            padding: 0.8rem; 
            margin-bottom: 1.2rem; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: #0f172a; 
            color: #e2e8f0; 
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        textarea { 
            resize: vertical; 
            min-height: 100px;
            font-family: inherit;
        }
        button { 
            width: 100%; 
            padding: 0.9rem; 
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover:not(:disabled) { 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status { 
            margin-top: 1.2rem; 
            padding: 0.9rem; 
            border-radius: 8px; 
            display: none; 
            font-size: 0.9rem; 
            text-align: center;
            border: 1px solid;
        }
        .success { 
            background: rgba(6, 78, 59, 0.3);
            border-color: #064e3b;
            color: #6ee7b7; 
        }
        .error { 
            background: rgba(127, 29, 29, 0.3);
            border-color: #7f1d1d;
            color: #fca5a5; 
        }
        .info {
            background: rgba(30, 58, 138, 0.3);
            border-color: #1e3a8a;
            color: #93c5fd;
            font-size: 0.85rem;
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📄 Job Applier</h1>
    <p class="subtitle">Envía candidaturas personalizadas automáticamente</p>
    
    <label for="offer">URL de la oferta o correo de contacto</label>
    <input type="text" id="offer" placeholder="https://... o email@empresa.com" required>
    
    <label for="notes">Notas adicionales (opcional)</label>
    <textarea id="notes" placeholder="Ej: mencionar experiencia en React, disponibilidad inmediata..."></textarea>
    
    <button onclick="submitApplication()" id="submitBtn">Enviar candidatura 🚀</button>
    
    <div class="status" id="status"></div>
    
    <div class="info">
        💡 <strong>Tip:</strong> La primera vez te pedirá tu GitHub Personal Access Token (se guarda solo en tu navegador)
    </div>
</div>

<script>
async function submitApplication() {
    const offer = document.getElementById('offer').value.trim();
    const notes = document.getElementById('notes').value.trim();
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    
    if (!offer) {
        alert('⚠️ Introduce una URL o email');
        return;
    }

    // Obtener o solicitar token
    let token = localStorage.getItem('gh_token');
    if (!token) {
        token = prompt('🔑 Introduce tu GitHub Personal Access Token:\n\n(Se guardará solo en tu navegador)\n\nCómo obtenerlo:\n1. Ve a GitHub → Settings → Developer settings\n2. Personal access tokens → Tokens (classic)\n3. Generate new token (selecciona "repo" y "workflow")');
        if (!token) {
            alert('❌ Necesitas el token para continuar');
            return;
        }
        localStorage.setItem('gh_token', token);
    }

    // ⚠️ CAMBIA ESTO por tu usuario de GitHub
    const repo = 'jesugallardo/job-applier';
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    status.style.display = 'none';
    
    try {
        const res = await fetch(
            `https://api.github.com/repos/${repo}/actions/workflows/apply-job.yml/dispatches`,
            {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: { 
                        offer: offer,
                        notes: notes || ''
                    }
                })
            }
        );

        if (res.status === 204) {
            status.textContent = '✅ ¡Candidatura enviada! Revisa tu email en unos minutos.';
            status.className = 'status success';
            document.getElementById('offer').value = '';
            document.getElementById('notes').value = '';
        } else if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('gh_token');
            throw new Error('Token inválido. Recarga la página e introduce uno nuevo.');
        } else {
            const errorData = await res.json();
            throw new Error(errorData.message || `Error ${res.status}`);
        }
    } catch (e) {
        status.textContent = '❌ Error: ' + e.message;
        status.className = 'status error';
    }
    
    status.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar candidatura 🚀';
}

// Enter para enviar
document.getElementById('offer').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') submitApplication();
});
</script>
</body>
</html>
